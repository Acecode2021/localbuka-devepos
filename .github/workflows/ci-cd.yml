name: LocalBuka API CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t localbuka-api:${{ github.sha }} .

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Decode SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: /tmp/deploy_key
          script: |
            cd /home/ec2-user/app
            git pull origin main
            sudo docker rm -f localbuka-api || true
            sudo docker build -t localbuka-api:local .
            sudo docker run -d --restart always -p 80:3000 -e PORT=3000 --name localbuka-api localbuka-api:local
            sleep 5
            curl -fsS http://localhost/health || (echo "Health check failed" && exit 1)

      - name: Verify public URL
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}/health"; then
              echo "API is live"
              exit 0
            fi
            echo "Waiting... attempt $i"
            sleep 10
          done
          echo "Public health check failed"
          exit 1